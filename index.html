<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תעלומת הפלאג האחרון – המשחק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#050b05; --ph:#7dff7a; --dim:#3f9f3d; --amber:#ffc857; --white:#eaffea; --red:#ff7a6b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; height:100%; background:#000; }
  body { color:var(--ph); font-family:"Cousine","Courier New",monospace; font-size:clamp(15px,3.9vw,18px); line-height:1.6; }
  #wrap { height:100dvh; max-width:860px; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); position:relative; }
  #wrap::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom,transparent 0 2px,#0004 2px 3px); }
  header { display:flex; justify-content:space-between; gap:10px; padding:8px 14px; border-bottom:1px solid #1d3a1c; color:var(--dim); font-size:.82em; }
  #pic { display:block; flex:none; width:min(calc(100% - 20px), calc(32dvh * 1.4583), 470px); height:auto; aspect-ratio:280/192; margin:8px auto 0; background:var(--bg); border:1px solid #1d3a1c; image-rendering:crisp-edges; image-rendering:pixelated; filter:drop-shadow(0 0 3px #3fff3a77); }
  #out { flex:1; overflow-y:auto; padding:14px 14px 6px; text-shadow:0 0 6px #3fff3a66; overscroll-behavior:contain; }
  #out p { margin:0 0 .7em; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { color:var(--white); }
  .you::before { content:"> "; color:var(--dim); }
  .say { color:var(--amber); text-shadow:0 0 6px #ffc85755; }
  .sys { color:var(--dim); }
  .big { color:var(--white); font-weight:700; font-size:1.15em; }
  .wa { color:#9fd6ff; text-shadow:0 0 6px #6fb8ff55; }
  .ltr { direction:ltr; text-align:left; color:var(--amber); font-weight:700; letter-spacing:.06em; }
  .err { color:var(--red); }
  #keys { display:flex; gap:6px; padding:6px 10px 0; flex-wrap:wrap; }
  #keys button { all:unset; cursor:pointer; border:1px solid #2c5a2a; color:var(--dim); padding:4px 10px; border-radius:3px; font-size:.82em; }
  #keys button:hover { color:var(--ph); border-color:var(--dim); }
  #keys button:focus-visible, #in:focus-visible { outline:2px solid var(--ph); outline-offset:2px; }
  form { display:flex; align-items:center; gap:8px; padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px)); }
  form span { color:var(--white); font-weight:700; }
  #in { flex:1; min-width:0; background:transparent; border:0; border-bottom:1px solid #2c5a2a; color:var(--white); font:inherit; padding:6px 2px; caret-color:var(--ph); }
  #wrap.frozen #out { animation:jit .12s steps(2) infinite; }
  #wrap.frozen form { opacity:.25; }
  @keyframes jit { 50% { transform:translateX(2px); filter:brightness(1.4); } }
  @media (prefers-reduced-motion:reduce) { #wrap.frozen #out { animation:none; } }
</style>
</head>
<body>
<div id="wrap">
  <header><span>תעלומת הפלאג האחרון</span><span id="clock"></span></header>
  <canvas id="pic" width="280" height="192" role="img" aria-label="תמונת המקום"></canvas>
  <div id="out" aria-live="polite"></div>
  <div id="keys">
    <button type="button" data-c="הבט">הבט</button>
    <button type="button" data-c="מלאי">מלאי</button>
    <button type="button" data-c="קטלוג">קטלוג</button>

<script>
(function () {

var outEl = document.getElementById("out"), inEl = document.getElementById("in"),

function fresh() { return { loc:"salon", inv:[], f:{}, min:20*60+10, hints:0, mode:null, q:0, eitan:0, n:0, over:false }; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { var j = localStorage.getItem(KEY); return j ? JSON.parse(j) : null; } catch (e) { return null; } }

function out(t, cls) { var p = document.createElement("p"); if (cls) p.className = cls; p.textContent = t; outEl.appendChild(p); outEl.scrollTop = outEl.scrollHeight; }
function say(t) { out(t, "say"); }
function sys(t) { out(t, "sys"); }
function wa(who, t) { out("[ווטסאפ] " + who + ": " + t, "wa"); }
function tick(m) { S.min += m; }
function clockStr() { var m = S.min % 1440; var h = Math.floor(m / 60), mm = m % 60; return (h < 10 ? "0" : "") + h + ":" + (mm < 10 ? "0" : "") + mm; }
function showClock() { clockEl.textContent = "נס ציונה · " + clockStr(); }
function has(i) { return S.inv.indexOf(i) >= 0; }
function give(i) { if (!has(i)) S.inv.push(i); }
function drop(i) { var k = S.inv.indexOf(i); if (k >= 0) S.inv.splice(k, 1); }
var F = function () { return S.f; };

function encode(s) { return s.split("").map(function (ch) { var c = ch.charCodeAt(0); return (c >= 0x5D0 && c <= 0x5EA) ? String.fromCharCode(0x60 + c - 0x5D0) : ch; }).join(""); }

/* ---------- מילון ---------- */

  dahan:["דהן"], sharon:["שרון"], nir:["ניר"], inbar:["ענבר","עינבר"], gil:["גיל"], nachshon:["נחשון","פלונטר"],

  stairs:["מדרגות","למטה"], shelter:["מקלט","פנימה"], door:["דלת"],
  iic:["iic","2c","c","מחשב","כלבו","מסך"], plug:["פלאג","תקע"], sw:["מתג"], psu:["ספק"], table:["טבלה","מיפוי"],
  catalog:["קטלוג"], acetone:["אצטון"], lisa:["ליסה"], m100:["100","מודל","מודם","trs"], pcable:["מדפסת","מקבילי"],
  scsi:["scsi","סקאזי","סקזי"], cable:["כבל"], pcase:["מארז"], note:["פתק"], gplug:["גרמני"], trans:["טרנזיסטור","bc547","547"],

  tam:["tam","שנה","יובל"], mac:["מק","מקינטוש","plus","פלוס"], disk:["דיסק"], guard:["שומר","1"], pizza:["פיצה"], file:["קובץ","אפריל"],

  iie:["iie","2e"], sixty:["60","$60"]
};

  take:["קח","קחי","הרם","אסוף"],
  talk:["דבר","דברי","שאל","שוחח","פנה"],
  use:["השתמש","הפעל","חבר","הדלק","הזז","תקן","הכנס","פתח","הלחם","בנה","חייג","מרח","הראה","נתק"],
  give:["תן","תני"],
  listen:["הקשב","הקשיבי","המשך","שמע"],

  ask:["בקש","בקשי"],
  inv:["מלאי","מ","תיק"], cat:["קטלוג"], help:["עזרה","?","help"], hint:["רמז"], restart:["מחדש"], gfx:["תמונה","גרפיקה"]
};
var PRE = "והלבמשכ";
function mk(tok, kw) {
  if (tok === kw) return true;
  var d = tok.length - kw.length;
  if (d < 1 || d > 2 || tok.slice(d) !== kw || kw.length < 2) return false;
  for (var i = 0; i < d; i++) if (PRE.indexOf(tok[i]) < 0) return false;
  return true;
}
var T = [];
function t(id) { var k = N[id]; for (var i = 0; i < T.length; i++) for (var j = 0; j < k.length; j++) if (mk(T[i], k[j])) return true; return false; }
function norm(s) { return s.toLowerCase().replace(/[֑-ׇ]/g, "").replace(/\/\/c/g, "iic").replace(/[״"'׳.,!?:;()\-\/\\]/g, " ").split(/\s+/).filter(Boolean); }
function verbOf(tok) { for (var v in VERBS) if (VERBS[v].indexOf(tok) >= 0) return v; return null; }

var CAT = [

  [["1","i","ראשון","ווזניאק","אפל1"], "APPLE I · 1976", "המחשב הראשון של אפל. ווזניאק תכנן ובנה אותו ביד. נמכר כלוח אם בלבד, בלי מארז, ספק או מקלדת, במחיר המפורסם של 666.66 דולר."],
  [["2","ii","שני","visicalc"], "APPLE ][ · 1977", "הפך את המחשב האישי למוצר להמונים. VisiCalc, הגיליון האלקטרוני הראשון, עשה ממנו כלי עבודה בכל עסק."],
  [["vax","וקס"], "DIGITAL VAX-11/780 · 1977", "קו הבסיס שלפיו נמדדו כל המחשבים: כוח העיבוד שלו הוגדר כ-MIPS אחד."],
  [["pet","פט"], "COMMODORE PET · 1977", "הכל-באחד הראשון: מסך, מקלדת וכונן קלטות במארז מתכת אחד."],
  [["trs","80","טנדי"], "TANDY TRS-80 · 1977", "נמכר ברשת Radio Shack והביא את המחשב לכל עיירה קטנה."],
  [["atari","אטארי","400","800"], "ATARI 400/800 · 1979", "תוכנן כמערכת משחקים ושווק כמחשב. הראשון עם שבבים ייעודיים לגרפיקה ולסאונד. כן, הוא יודע לעשות גרפיקה."],
  [["ti","99","טקסס"], "TI-99/4 · 1979", "המחשב הביתי הראשון עם מעבד 16 ביט. הצית את מלחמת המחירים שהוציאה את היצרנית שלו מהשוק."],

  [["pc","8088","ibm","יבמ"], "IBM PC · 1981", "המחשב שהגדיר את המושג PC. נבנה מרכיבי מדף. המוח שלו, מעבד האינטל 8088, תוכנן ופותח כולו במרכז הפיתוח של אינטל בחיפה."],
  [["osborne","אוסבורן"], "OSBORNE ONE · 1981", "הנייד המסחרי המצליח הראשון. מזוודה של 11 קילו עם מסך של 5 אינץ'."],
  [["zx81","zx","סינקלייר","sinclair"], "SINCLAIR ZX81 · 1981", "ארבעה שבבים בלבד על הלוח. שער הכניסה של דור שלם לתכנות."],

  [["clc","9100","צב","לוגו","עץ","הדעת"], "CLC 9100 · 1984", "מחשב חינוכי ישראלי של חברת ״עץ הדעת״, שפותח בקיבוץ יסעור כדי ללמד ילדים את שפת Logo. במרכזו הצב המפורסם."],

function catalog() {
  if (!has("catalog")) { out("אין לך קטלוג. מי שכתב אותו נמצא בסלון."); return; }
  var toks = T.slice(1);
  if (!toks.length) { out("״קטלוג המחשבים״, גרסה 30, מאת אודי ויינשטיין. הפרק הפתוח: תור הזהב של המחשב האישי, 1975–1990."); sys("הקלד קטלוג ואחריו שם של מחשב. למשל: קטלוג ליסה. בין הערכים: " + CAT.map(function (c) { return c[1].split(" · ")[0]; }).join(", ") + "."); return; }
  var best = null, bs = 0;
  CAT.forEach(function (c) { var sc = 0; toks.forEach(function (tk) { c[0].forEach(function (k) { if (tk === k || mk(tk, k)) sc += k.length > 1 ? 2 : 1; }); }); if (sc > bs) { bs = sc; best = c; } });

}
